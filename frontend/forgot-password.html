<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiskLens AI — Recuperar contraseña</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login-container">
        <div class="login-right">
            <div class="login-form-wrapper">
                <div class="login-logo">
                    <img src="assets/images/logo.png" width="40" height="40" style="border-radius:10px">
                    <span style="font-size:18px;font-weight:700;color:var(--text)">RiskLens AI</span>
                </div>
                <h1 class="login-title">Recuperar contraseña</h1>
                <p class="login-subtitle">Te enviaremos un enlace a tu email</p>

                <div id="errorMsg"
                    style="display:none;color:var(--red);font-size:12px;background:var(--red-bg);border:1px solid rgba(220,38,38,.15);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-family:'IBM Plex Mono',monospace">
                </div>
                <div id="successMsg"
                    style="display:none;color:var(--green);font-size:12px;background:rgba(16,163,74,.08);border:1px solid rgba(16,163,74,.2);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-family:'IBM Plex Mono',monospace">
                </div>

                <div class="field-group" style="margin-bottom:20px">
                    <label>Email</label>
                    <input class="field-input" id="inputEmail" type="email" placeholder="tu@email.com">
                </div>

                <button class="btn-analyze" id="btnSend">Enviar enlace</button>
                <div style="text-align:center;margin-top:16px">
                    <a href="login.html" style="font-size:13px;color:var(--text3)">← Volver al login</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("btnSend").addEventListener("click", async function () {
            const btn = document.getElementById("btnSend");
            const email = document.getElementById("inputEmail").value.trim();
            const errorEl = document.getElementById("errorMsg");
            const successEl = document.getElementById("successMsg");

            errorEl.style.display = "none";
            successEl.style.display = "none";

            if (!email) {
                errorEl.textContent = "Introduce tu email.";
                errorEl.style.display = "block";
                return;
            }

            btn.textContent = "Enviando...";
            btn.disabled = true;

            try {
                const res = await fetch("http://localhost:3001/auth/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (!res.ok || !data.ok) throw new Error(data.error || "Error al enviar");

                successEl.textContent = "Si el email existe recibirás el enlace en unos segundos.";
                successEl.style.display = "block";
                document.getElementById("inputEmail").value = "";
            } catch (err) {
                errorEl.textContent = "Error: " + err.message;
                errorEl.style.display = "block";
            } finally {
                btn.textContent = "Enviar enlace";
                btn.disabled = false;
            }
        });

        document.getElementById("inputEmail").addEventListener("keydown", function (e) {
            if (e.key === "Enter") document.getElementById("btnSend").click();
        });
    </script>
</body>

</html>
