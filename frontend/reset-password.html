<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiskLens AI — Nueva contraseña</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login-container">
        <div class="login-right">
            <div class="login-form-wrapper">
                <div class="login-logo">
                    <img src="assets/images/logo.png" width="40" height="40" style="border-radius:10px">
                    <span style="font-size:18px;font-weight:700;color:var(--text)">RiskLens AI</span>
                </div>
                <h1 class="login-title">Nueva contraseña</h1>
                <p class="login-subtitle">Introduce tu nueva contraseña</p>

                <div id="errorMsg"
                    style="display:none;color:var(--red);font-size:12px;background:var(--red-bg);border:1px solid rgba(220,38,38,.15);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-family:'IBM Plex Mono',monospace">
                </div>
                <div id="successMsg"
                    style="display:none;color:var(--green);font-size:12px;background:rgba(16,163,74,.08);border:1px solid rgba(16,163,74,.2);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-family:'IBM Plex Mono',monospace">
                </div>

                <div class="field-group" style="margin-bottom:12px">
                    <label>Nueva contraseña</label>
                    <input class="field-input" id="inputPassword" type="password" placeholder="Mínimo 6 caracteres">
                </div>
                <div class="field-group" style="margin-bottom:20px">
                    <label>Confirmar contraseña</label>
                    <input class="field-input" id="inputConfirm" type="password" placeholder="Repite la contraseña">
                </div>

                <button class="btn-analyze" id="btnReset">Restablecer contraseña</button>
                <div style="text-align:center;margin-top:16px">
                    <a href="login.html" style="font-size:13px;color:var(--text3)">← Volver al login</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        if (!token) window.location.href = "login.html";

        document.getElementById("btnReset").addEventListener("click", async function () {
            const btn = document.getElementById("btnReset");
            const password = document.getElementById("inputPassword").value.trim();
            const confirm = document.getElementById("inputConfirm").value.trim();
            const errorEl = document.getElementById("errorMsg");
            const successEl = document.getElementById("successMsg");

            errorEl.style.display = "none";
            successEl.style.display = "none";

            if (!password || password.length < 6) {
                errorEl.textContent = "La contraseña debe tener al menos 6 caracteres.";
                errorEl.style.display = "block";
                return;
            }

            if (password !== confirm) {
                errorEl.textContent = "Las contraseñas no coinciden.";
                errorEl.style.display = "block";
                return;
            }

            btn.textContent = "Guardando...";
            btn.disabled = true;

            try {
                const res = await fetch("http://localhost:3001/auth/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();

                if (!res.ok || !data.ok) throw new Error(data.error || "Error al restablecer");

                successEl.textContent = "Contraseña actualizada. Redirigiendo al login...";
                successEl.style.display = "block";

                setTimeout(function () { window.location.href = "login.html"; }, 2000);
            } catch (err) {
                errorEl.textContent = "Error: " + err.message;
                errorEl.style.display = "block";
            } finally {
                btn.textContent = "Restablecer contraseña";
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
